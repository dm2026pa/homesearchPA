<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#090d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Portal Inmobiliario Familiar — Ciudad de Panamá</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --surface: #111827;
            --surface-card: #1a2234;
            --border: #2d3748;
            --primary: #38bdf8;
            --primary-dark: #0284c7;
            --accent-green: #10b981;
            --accent-purple: #a855f7;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: max(60px, env(safe-area-inset-bottom));
            font-size: 14px;
            overflow-x: hidden;
        }

        /* --- HEADER & NAVIGATION (MOBILE-FIRST) --- */
        header {
            background: rgba(17, 24, 39, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: max(10px, env(safe-area-inset-top)) 12px 10px 12px;
        }

        .header-content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 1360px;
            margin: 0 auto;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .brand-text {
            min-width: 0;
        }

        .brand-text h1 {
            font-size: 16px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.3px;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-text p {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: none;
        }

        .refresh-cloud-btn {
            background: rgba(35, 134, 54, 0.25);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.45);
            padding: 7px 11px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            flex-shrink: 0;
            min-height: 36px;
            transition: all 0.2s;
        }

        .refresh-cloud-btn:active {
            background: #238636;
            color: #fff;
            transform: scale(0.97);
        }

        /* --- BUDGET CONTROLLER --- */
        .budget-control-box {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 8px 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .budget-main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .budget-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .budget-input-wrap {
            display: flex;
            align-items: center;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px 8px;
            max-width: 155px;
        }

        .budget-input-wrap span {
            color: var(--primary);
            font-weight: 800;
            font-size: 14px;
        }

        .budget-input-wrap input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px; /* Prevents auto-zoom on iOS Safari */
            font-weight: 800;
            width: 85px;
            text-align: right;
            padding: 0 4px;
        }

        .budget-input-wrap input:focus {
            outline: none;
        }

        .quick-budgets {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

        .quick-budgets::-webkit-scrollbar {
            display: none;
        }

        .q-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .q-btn:hover, .q-btn.active {
            background: var(--primary);
            color: #090d16;
            border-color: var(--primary);
        }

        /* --- MAIN CONTAINER --- */
        .container {
            max-width: 1360px;
            margin: 12px auto;
            padding: 0 12px;
        }

        /* --- STATS GRID (MOBILE 2-COLUMNS) --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 12px;
        }

        .stat-card.stat-full {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-val {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            line-height: 1.1;
        }

        .stat-lbl {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* --- CATEGORY TABS (HORIZONTAL SWIPE) --- */
        .category-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            scroll-snap-type: x proximity;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            flex-shrink: 0;
            min-height: 38px;
            scroll-snap-align: start;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            border-color: var(--primary);
            color: #fff;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #090d16;
            border-color: var(--primary);
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.35);
        }

        .tab-count {
            background: rgba(0, 0, 0, 0.25);
            padding: 1px 6px;
            border-radius: 999px;
            font-size: 11px;
        }

        /* --- SEARCH & MOBILE FILTERS DRAWER --- */
        .search-bar-wrap {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .search-box {
            flex: 1;
        }

        .search-box input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 16px; /* Prevents auto-zoom on iOS */
            min-height: 44px;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .filter-toggle-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: #fff;
            padding: 0 12px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            white-space: nowrap;
            min-height: 44px;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .filter-toggle-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(56, 189, 248, 0.1);
        }

        /* Collapsible Filter Panel on Mobile */
        .filters-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 16px;
            display: none; /* Hidden by default on mobile, toggled with button */
            flex-direction: column;
            gap: 10px;
        }

        .filters-panel.open {
            display: flex;
        }

        .filters-select-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .select-filter select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            min-height: 42px;
        }

        .select-filter select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .price-range-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .price-input-field {
            flex: 1;
        }

        .price-input-field label {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 2px;
        }

        .price-input-field input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 14px;
            min-height: 40px;
        }

        .price-input-field input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 4px 0;
            flex-wrap: wrap;
        }

        .checkbox-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            color: #cbd5e1;
            cursor: pointer;
        }

        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .reset-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11.5px;
            cursor: pointer;
        }

        /* --- PROPERTY CARDS (MOBILE SINGLE COLUMN) --- */
        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .prop-card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .card-media {
            position: relative;
            height: 205px;
            background: #0b1120;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .no-photo {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #64748b;
            font-size: 14px;
        }

        .badge-cat {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10.5px;
            font-weight: 800;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        .badge-cat.nueva { background: #059669; color: #fff; }
        .badge-cat.remodelado { background: #7c3aed; color: #fff; }
        .badge-cat.usado { background: #2563eb; color: #fff; }

        .badge-score {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            color: #38bdf8;
            z-index: 2;
        }

        .badge-dev {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: #f59e0b;
            color: #0f172a;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        .badge-year {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 10.5px;
            font-weight: 800;
            z-index: 2;
        }

        .card-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .price-line {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }

        .price-val {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            line-height: 1.1;
        }

        .price-m2 {
            font-size: 12px;
            color: var(--text-muted);
        }

        .badge-budget {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 8px;
            align-self: flex-start;
        }

        .badge-budget.ok { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
        .badge-budget.neg { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.35); }
        .badge-budget.over { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.35); }

        .prop-title {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 4px;
            color: #f1f5f9;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .prop-loc {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .specs-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 10px;
            text-align: center;
            font-size: 12px;
        }

        .checklist-box {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 11.5px;
        }

        .check-item {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            margin-bottom: 3px;
            color: #cbd5e1;
            line-height: 1.3;
        }

        .check-icon {
            color: #10b981;
            font-weight: 800;
            flex-shrink: 0;
        }

        .kids-box {
            margin-bottom: 12px;
        }

        .kids-title {
            font-size: 10.5px;
            font-weight: 700;
            color: #f59e0b;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .kids-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .ktag {
            background: rgba(245, 158, 11, 0.12);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.25);
            font-size: 10.5px;
            padding: 2px 7px;
            border-radius: 5px;
        }

        .card-footer {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 11.5px;
            color: var(--text-muted);
            margin-top: auto;
        }

        .action-btn {
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 46px;
            transition: all 0.2s;
        }

        .action-btn:active {
            background: #1d4ed8;
            transform: scale(0.98);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 16px;
            background: var(--surface);
            border-radius: 16px;
            border: 1px dashed var(--border);
        }

        /* --- FLOATING BACK TO TOP BUTTON --- */
        .back-to-top {
            position: fixed;
            bottom: max(20px, env(safe-area-inset-bottom));
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: #090d16;
            border: none;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            z-index: 99;
            transition: all 0.2s;
        }

        .back-to-top:active {
            transform: scale(0.92);
        }

        /* =======================================================
           TABLET & DESKTOP BREAKPOINTS (PROGRESSIVE ENHANCEMENTS)
           ======================================================= */
        @media (min-width: 640px) {
            .container {
                padding: 0 20px;
            }

            .brand-text h1 {
                font-size: 18px;
            }

            .brand-text p {
                display: block;
                font-size: 12px;
            }

            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .stat-card.stat-full {
                grid-column: auto;
                display: block;
            }

            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .card-footer {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }

            .action-btn {
                width: auto;
                padding: 8px 16px;
                min-height: 38px;
            }
        }

        @media (min-width: 900px) {
            header {
                padding: 14px 24px;
            }

            .header-content {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }

            .budget-control-box {
                width: auto;
                flex-direction: row;
                align-items: center;
                gap: 12px;
            }

            .stats-grid {
                grid-template-columns: repeat(5, 1fr);
            }

            /* Always display filter panel on desktop */
            .filters-panel {
                display: flex !important;
            }

            .filter-toggle-btn {
                display: none;
            }

            .filters-select-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (min-width: 1100px) {
            .cards-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 24px;
            }

            .prop-card {
                transition: all 0.25s ease;
            }

            .prop-card:hover {
                transform: translateY(-5px);
                border-color: var(--primary);
                box-shadow: 0 16px 30px -10px rgba(0, 0, 0, 0.6);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="header-top">
                <div class="brand">
                    <div class="brand-icon">🏠</div>
                    <div class="brand-text">
                        <h1>Homesearch Panamá</h1>
                        <p>3 Rec + CBE + Sala ≥42 m² + Estudio TV ≥15 m² + Comunidad Niños</p>
                    </div>
                </div>
                <a href="https://github.com/dm2026pa/homesearchPA/actions/workflows/update_listings.yml" target="_blank" class="refresh-cloud-btn" title="Refrescar catálogo en GitHub Actions">
                    ⚡ Refrescar ↗
                </a>
            </div>

            <!-- Dynamic Budget Box -->
            <div class="budget-control-box">
                <div class="budget-main-row">
                    <div class="budget-label">🎯 Presupuesto:</div>
                    <div class="budget-input-wrap">
                        <span>$</span>
                        <input type="number" id="budgetInput" value="380000" step="10000" min="150000" max="1000000" oninput="onBudgetChanged(this.value)">
                        <span style="font-size: 11px; color: var(--text-muted); margin-left: 4px;">USD</span>
                    </div>
                </div>
                <div class="quick-budgets">
                    <button type="button" class="q-btn" onclick="setQuickBudget(320000)">$320k</button>
                    <button type="button" class="q-btn" onclick="setQuickBudget(350000)">$350k</button>
                    <button type="button" class="q-btn active" id="btn-380" onclick="setQuickBudget(380000)">$380k</button>

            const avgP = filtered.length > 0 ? Math.round(filtered.reduce((sum, p) => sum + p.price, 0) / filtered.length) : 0;
            const avgM = filtered.length > 0 ? Math.round(filtered.reduce((sum, p) => sum + p.area_m2, 0) / filtered.length) : 0;
            if (statAvgPriceEl) statAvgPriceEl.textContent = avgP > 0 ? '$' + avgP.toLocaleString() : '$0';
            if (statAvgM2El) statAvgM2El.textContent = avgM > 0 ? avgM + ' m²' : '0 m²';

            // Sorting
            filtered.sort((a, b) => {
                if (sort === 'price_asc') return a.price - b.price;
                if (sort === 'price_desc') return b.price - a.price;
                if (sort === 'm2_desc') return b.area_m2 - a.area_m2;
                if (sort === 'year_desc') return (b.year_built || 0) - (a.year_built || 0);
                return b.dynamicScore - a.dynamicScore;
            });

            renderCards(filtered);
        }

        function renderCards(list) {
            const grid = document.getElementById('cardsGrid');
            if (list.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <h3>No se encontraron inmuebles con los criterios actuales</h3>
                        <p style="color: #94a3b8; margin-top: 8px;">Prueba ajustando el presupuesto objetivo o ampliando el rango de precio.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = list.map(p => {
                const isNueva = p.category_group === 'nuevas_estrenar';
                const isRemodelado = p.newness_status && p.newness_status.toLowerCase().includes('remodelado');
                const catClass = isNueva ? 'nueva' : (isRemodelado ? 'remodelado' : 'usado');
                const isDirectDev = p.portal.toLowerCase().includes('directa');

                const photoTag = p.photo_url ? 
                    `<img src="${p.photo_url}" alt="${p.title}" class="card-img" onerror="this.src='https://via.placeholder.com/400x220?text=Foto+Propiedad'">` :
                    `<div class="no-photo">🏠 Foto en portal</div>`;

                const devBadge = isDirectDev ? `<div class="badge-dev">🏷️ PROMOTORA DIRECTA</div>` : '';
                const yearBadge = p.year_built ? `<div class="badge-year">📅 ${p.year_built >= 2025 ? 'Entrega ' + p.year_built : 'Año ' + p.year_built}</div>` : '';

                // Dynamic Budget Badge
                let budgetBadge = '';
                const diff = p.price - currentBudget;
                if (p.price <= currentBudget) {
                    const saved = currentBudget - p.price;
                    budgetBadge = `<div class="badge-budget ok">✓ Dentro de Presupuesto ${saved > 0 ? '(-$' + saved.toLocaleString() + ')' : '(Exacto)'}</div>`;
                } else if (p.price <= currentBudget * 1.10) {
                    const pct = Math.round((diff / currentBudget) * 100);
                    budgetBadge = `<div class="badge-budget neg">⚠️ Negociable (+${pct}% / +$${diff.toLocaleString()})</div>`;
                } else {
                    budgetBadge = `<div class="badge-budget over">📈 Sobre Presupuesto (+$${diff.toLocaleString()})</div>`;
                }

                const ams = p.kids_amenities || [];
                const amsHtml = ams.map(a => `<span class="ktag">${a}</span>`).join('');

                const maintStr = p.maintenance_fee ? `Mantenimiento: $${p.maintenance_fee.toLocaleString()}/mes` : (isDirectDev ? 'Venta de Proyecto Nuevo' : 'Mantenimiento por validar');

                const devInfo = p.developer ? `<div class="check-item"><span class="check-icon">🏗️</span> Promotora: <strong>${p.developer}</strong></div>` : '';
                const deliveryInfo = p.delivery_status ? `<div class="check-item"><span class="check-icon">⏱️</span> Entrega: <strong>${p.delivery_status}</strong></div>` : '';

                return `
                    <div class="prop-card">
                        <div class="card-media">
                            ${photoTag}
                            <div class="badge-cat ${catClass}">${p.category_label}</div>
                            ${devBadge}
                            ${yearBadge}
                            <div class="badge-score">${p.dynamicScore}% Match</div>
                        </div>
                        <div class="card-body">
                            <div class="price-line">
                                <span class="price-val">${p.price_formatted}</span>
                                <span class="price-m2">$${Math.round(p.price_per_m2).toLocaleString()} / m²</span>
                            </div>

                            ${budgetBadge}

                            <h3 class="prop-title" title="${p.title}">${p.title}</h3>
                            <div class="prop-loc">📍 ${p.location || 'Ciudad de Panamá'}</div>

                            <div class="specs-row">
                                <div>🛏️ <strong>${p.rooms}</strong> Rec.</div>
                                <div>🚿 <strong>${p.baths}</strong> Baños</div>
                                <div>📐 <strong>${p.area_m2}</strong> m²</div>
                            </div>

                            <div class="checklist-box">
                                ${devInfo}
                                ${deliveryInfo}
                                <div class="check-item"><span class="check-icon">✓</span> Cuarto y Baño de Empleada (CBE) confirmado</div>
                                <div class="check-item"><span class="check-icon">✓</span> Sala-Comedor espaciosa (viable ≥42 m²)</div>
                                <div class="check-item"><span class="check-icon">✓</span> Espacio para Estudio/TV ≥15 m²: ${p.study_confirmed ? 'Sí' : 'Adaptable'}</div>
                            </div>

                            <div class="kids-box">
                                <div class="kids-title">🧒 Comunidad & Amenidades para Niños:</div>
                                <div class="kids-tags">${amsHtml || '<span class="ktag">Comunidad familiar y segura</span>'}</div>
                            </div>

                            <div class="card-footer">
                                <span>${maintStr}</span>
                                <a href="${p.url}" target="_blank" class="action-btn">${isDirectDev ? 'Ver Proyecto Directo ↗' : 'Ver en ' + p.portal + ' ↗'}</a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Back to top listener
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('backToTop');
            if (btn) {
                btn.style.display = window.scrollY > 350 ? 'flex' : 'none';
            }
        });

        // Initial Render
        document.addEventListener('DOMContentLoaded', () => {
            applyFilters();
        });
    </script>
</body>
</html>
